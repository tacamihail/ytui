# Builds the release binaries on github's runners and attaches them to the
# tag's release, so `install.ps1`, `install.sh` and `ytui update` can download
# a prebuilt binary instead of needing Rust and a C toolchain on the machine.
#
# Push a tag that matches the [package] version, for example:
#
#   git tag v0.4.11 && git push origin v0.4.11
#
# `workflow_dispatch` builds the same assets without publishing a release; the
# files are on the run page, which is enough to test the installers.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows binary links the C runtime statically so it does not
          # need the Visual C++ redistributable on the user's machine.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ytui-x86_64-pc-windows-msvc.exe
            rustflags: -C target-feature=+crt-static
            smoke: 'yes'
          # 22.04 keeps the binary runnable on older glibc than ubuntu-latest
          # (24.04 would require glibc 2.39).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: ytui-x86_64-unknown-linux-gnu
            rustflags: ''
            smoke: 'yes'
          - os: macos-26
            target: aarch64-apple-darwin
            asset: ytui-aarch64-apple-darwin
            rustflags: ''
            smoke: 'yes'
          - os: macos-26-intel
            target: x86_64-apple-darwin
            asset: ytui-x86_64-apple-darwin
            rustflags: ''
            smoke: 'yes'
    steps:
      - uses: actions/checkout@v4

      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print $2; exit}' Cargo.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: audio headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The ubuntu mirrors these images use have intermittently failed to
          # resolve on the runners. Pick a mirror that resolves, and fall back to
          # public resolvers when none do, instead of losing the whole build.
          mirrors=(
            'https://mirrors.edge.kernel.org/ubuntu/'
            'https://ftp.osuosl.org/pub/ubuntu/'
            'http://archive.ubuntu.com/ubuntu/'
          )
          pick_mirror() {
            local m host
            for m in "${mirrors[@]}"; do
              host="${m#*://}"
              host="${host%%/*}"
              if getent hosts "$host" >/dev/null 2>&1; then
                printf '%s\n' "$m"
                return 0
              fi
            done
            return 1
          }
          base="$(pick_mirror)" || base=""
          if [ -z "$base" ]; then
            echo "no ubuntu mirror resolves; retrying with public resolvers"
            sudo sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
            base="$(pick_mirror)" || {
              echo "still cannot resolve an ubuntu mirror" >&2
              exit 1
            }
          fi
          echo "apt mirror: $base"
          printf '%s\n' "$base" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: collect the asset
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          case "$ASSET" in *.exe) exe=".exe" ;; esac
          mkdir -p dist
          cp "target/$TARGET/release/ytui$exe" "dist/$ASSET"
          # A binary that cannot even print its version is not shippable.
          if [ "${{ matrix.smoke }}" = yes ]; then
            "./dist/$ASSET" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    # Publish whatever the builders produced even when one platform failed: the
    # installers fall back to a source build when an asset is missing, and the
    # red run still reports the failure.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no build produced an asset; there is nothing to publish" >&2
            exit 1
          fi
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A rerun after a failed upload must not fail on the existing release.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
