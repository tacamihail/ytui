# Builds the release binaries on github's runners and attaches them to the
# tag's release, so `install.ps1`, `install.sh` and `ytui update` can download
# a prebuilt binary instead of needing Rust and a C toolchain on the machine.
#
# Push a tag that matches the [package] version, for example:
#
#   git tag v0.4.11 && git push origin v0.4.11
#
# `workflow_dispatch` builds the same assets without publishing a release; the
# files are on the run page, which is enough to test the installers.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows binary links the C runtime statically so it does not
          # need the Visual C++ redistributable on the user's machine.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ytui-x86_64-pc-windows-msvc.exe
            rustflags: -C target-feature=+crt-static
            smoke: 'yes'
          # 22.04 keeps the binary runnable on older glibc than ubuntu-latest
          # (24.04 would require glibc 2.39).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: ytui-x86_64-unknown-linux-gnu
            rustflags: ''
            smoke: 'yes'
          - os: macos-14
            target: aarch64-apple-darwin
            asset: ytui-aarch64-apple-darwin
            rustflags: ''
            smoke: 'yes'
          # Cross-compiled on an arm64 runner; the x86_64 binary cannot be run
          # here without Rosetta, and its smoke test would be the only one.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: ytui-x86_64-apple-darwin
            rustflags: ''
            smoke: 'no'
    steps:
      - uses: actions/checkout@v4

      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print $2; exit}' Cargo.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: collect the asset
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          case "$ASSET" in *.exe) exe=".exe" ;; esac
          mkdir -p dist
          cp "target/$TARGET/release/ytui$exe" "dist/$ASSET"
          # A binary that cannot even print its version is not shippable.
          if [ "${{ matrix.smoke }}" = yes ]; then
            "./dist/$ASSET" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A rerun after a failed upload must not fail on the existing release.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
