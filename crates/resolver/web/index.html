<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ytui</title>
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ytui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>
:root {
  color-scheme: dark;
  --bg: #101014; --panel: #15151b; --panel2: #1c1c23;
  --line: #26262e; --text: #e8e8ec; --muted: #8a8a96; --accent: #4cc38a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }

/* ---------- header ---------- */
header {
  flex: none; z-index: 2;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
nav { display: flex; }
nav button {
  flex: 1; min-height: 50px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted); font: inherit; font-weight: 700; font-size: 14px;
  letter-spacing: .02em; touch-action: manipulation; cursor: pointer;
}
nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- content ---------- */
main {
  flex: 1; overflow-y: auto; overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
}
.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; min-height: 58px;
  border-bottom: 1px solid #1c1c23;
  transition: background-color .2s ease;
  touch-action: manipulation;
  /* keeps a scrolled-to row below the sticky search bar / toolbar */
  scroll-margin-top: 66px;
}
#queue-list .row { scroll-margin-top: 10px; }
.row .meta { flex: 1; min-width: 0; }
.row .meta:active { opacity: .6; }
.row .title {
  font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row .sub {
  color: var(--muted); font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row button {
  flex: none; width: 44px; height: 44px;
  display: grid; place-items: center;
  background: var(--panel2); color: var(--text);
  border: 1px solid #2c2c36; border-radius: 12px;
  font-size: 16px; touch-action: manipulation; cursor: pointer;
}
.row.playing .title { color: var(--accent); }
.row.playing { background: #141920; }

form.bar {
  position: sticky; top: 0; z-index: 1;
  display: flex; gap: 8px; padding: 10px 14px;
  background: var(--bg);
}
input {
  flex: 1; min-width: 0;
  font-size: 16px; /* stops iOS Safari from zooming on focus */
  background: var(--panel2);
  border: 1px solid #2c2c36; color: var(--text);
  border-radius: 12px; padding: 12px;
  font-family: inherit;
}
form.bar button {
  flex: none; min-height: 46px; padding: 0 18px;
  background: #26262e; border: 1px solid #2c2c36; border-radius: 12px;
  color: var(--text); font: inherit; font-weight: 600;
  touch-action: manipulation; cursor: pointer;
}
.toolbar {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg);
}
.toolbar button {
  min-height: 40px; padding: 0 16px;
  background: var(--panel2); border: 1px solid #2c2c36; border-radius: 10px;
  color: var(--text); font: inherit; font-weight: 600;
  touch-action: manipulation; cursor: pointer;
}
.toolbar .count { color: var(--muted); font-size: 13px; }

/* ---------- loading ---------- */
.skel {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; min-height: 58px;
  border-bottom: 1px solid #1c1c23;
}
.skel .circle {
  flex: none; width: 44px; height: 44px; border-radius: 12px;
  background: #1e1e26; animation: pulse 1.1s ease-in-out infinite;
}
.skel .bars { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.skel .b1, .skel .b2 {
  height: 12px; border-radius: 6px; background: #1e1e26;
  animation: pulse 1.1s ease-in-out infinite;
}
.skel .b1 { width: 68%; }
.skel .b2 { width: 34%; animation-delay: .18s; }
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
.spin {
  width: 18px; height: 18px; flex: none;
  border: 2px solid #3c3c48; border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  color: var(--muted); padding: 48px 24px; text-align: center; font-size: 14px;
}
.empty .spin { width: 26px; height: 26px; border-width: 3px; }

/* ---------- buttons ---------- */
button {
  transition: transform .12s ease, background-color .15s ease,
              border-color .15s ease, color .15s ease;
}
button:active { transform: scale(.9); }
nav button:active { transform: none; opacity: .7; }
button svg { display: block; }
.row button.done {
  color: var(--accent); border-color: var(--accent);
  animation: pop .32s ease;
}
@keyframes pop { 40% { transform: scale(1.18); } }

/* a button that is waiting for its stream */
button.busy svg { display: none; }
button.busy::after {
  content: ""; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid #3c3c48; border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
#play.busy::after {
  border-color: #0b0b0e40; border-top-color: #0b0b0e;
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- player ---------- */
#player {
  flex: none; z-index: 3; position: relative; overflow: hidden;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
#player[hidden] { display: none; }
/* The cover fills the left half of the player, cropped from the left edge,
   dimmed, and faded out by the middle of the screen. */
#player .bg, #player .bg-blur {
  position: absolute; left: 0; top: 0; height: 100%; width: 50%;
  pointer-events: none;
}
#player .bg {
  object-fit: cover; object-position: left center;
  opacity: .35;
  -webkit-mask-image: linear-gradient(to right, #000 0%, #000 22%, transparent 100%);
          mask-image: linear-gradient(to right, #000 0%, #000 22%, transparent 100%);
}
/* A soft vertical blur, strongest just under the title and gone by the
   transport; the radius stays small so compositing is cheap. */
#player .bg-blur {
  -webkit-backdrop-filter: blur(5px);
          backdrop-filter: blur(5px);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 40%, transparent 74%);
          mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 40%, transparent 74%);
}
#player .inner { position: relative; text-shadow: 0 1px 3px #000a; }
#player .line1 { min-width: 0; margin-bottom: 1px; text-align: center; }
#player .ptitle {
  display: block; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#player .sub {
  min-width: 0; color: var(--muted); font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* The elapsed time and the artist share a line either side of center; the
   artist truncates instead of wrapping or touching the timers. */
#player .line2 {
  display: grid; grid-template-columns: max-content 1fr max-content;
  align-items: center; gap: 8px;
  min-height: 16px; margin: 0 2px 2px;
}
#time-current { grid-column: 1; justify-self: start; }
#time-total { grid-column: 3; justify-self: end; }
#player .artist {
  grid-column: 2; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
#seek, #volume {
  -webkit-appearance: none; appearance: none;
  height: 28px; margin: 0;
  background: transparent; touch-action: manipulation;
}
#seek { width: 100%; margin: 0 0 2px; }
#volume { width: 110px; }
#seek::-webkit-slider-runnable-track, #volume::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), #2c2c36 var(--fill, 0%) 100%);
}
#seek::-webkit-slider-thumb, #volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); margin-top: -6px;
  box-shadow: 0 0 0 4px #4cc38a22;
}
#seek::-moz-range-track, #volume::-moz-range-track { height: 6px; border-radius: 3px; background: #2c2c36; }
#seek::-moz-range-thumb, #volume::-moz-range-thumb {
  width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--accent);
}
#player .controls {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 10px; margin-top: 2px;
}
#player .transport { display: flex; align-items: center; justify-content: center; gap: 22px; }
#player #shuffle { justify-self: start; }
#player .right { justify-self: end; display: flex; align-items: center; gap: 16px; }
#player button.on { color: var(--accent); border-color: var(--accent); }
/* Mute, volume and fullscreen ride the transport row on a desktop, where a
   mouse makes them useful; phones keep their hardware buttons instead. */
#player .extras { display: none; }
@media (hover: hover) and (pointer: fine) and (min-width: 820px) {
  #player .inner { max-width: 1000px; margin: 0 auto; }
  #player .extras { display: flex; align-items: center; gap: 6px; }
  #player .extras button { width: 34px; height: 34px; }
  #player .extras button svg { width: 18px; height: 18px; }
}
#player button {
  width: 46px; height: 46px; display: grid; place-items: center;
  background: var(--panel2); color: var(--text);
  border: 1px solid #2c2c36; border-radius: 50%;
  font-size: 17px; touch-action: manipulation; cursor: pointer;
}
#player button svg { width: 22px; height: 22px; }
#player #play {
  width: 60px; height: 60px;
  background: var(--accent); color: #0b0b0e; border: 0;
}
#player #play svg { width: 28px; height: 28px; }
/* The side buttons sit at the edges, so the transport keeps room on phones. */
@media (max-width: 440px) {
  #player button { width: 44px; height: 44px; }
  #player button svg { width: 21px; height: 21px; }
  #player #play { width: 60px; height: 60px; }
  #player #play svg { width: 28px; height: 28px; }
  #player .transport { gap: 16px; }
  #player .right { gap: 10px; }
}
@media (max-width: 340px) {
  #player button { width: 38px; height: 38px; }
  #player button svg { width: 18px; height: 18px; }
  #player #play { width: 50px; height: 50px; }
  #player #play svg { width: 24px; height: 24px; }
  #player .transport { gap: 10px; }
}
#time-current, #time-total { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#buffering[hidden] { display: none; }

/* ---------- overlays ---------- */
#overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: #101014ee; padding: 24px;
  padding-top: calc(24px + env(safe-area-inset-top));
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
#overlay[hidden] { display: none; }
#overlay .card {
  width: min(100%, 380px);
  background: var(--panel); border: 1px solid #2c2c36;
  border-radius: 16px; padding: 22px;
}
#overlay h2 { margin: 0 0 6px; font-size: 18px; }
#overlay p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
#overlay code { font-size: 12px; }
#overlay form { display: flex; gap: 8px; }
#overlay button {
  flex: none; min-height: 46px; padding: 0 18px;
  background: var(--accent); color: #0b0b0e; border: 0; border-radius: 12px;
  font: inherit; font-weight: 700; touch-action: manipulation; cursor: pointer;
}
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(140px + env(safe-area-inset-bottom));
  z-index: 11; max-width: 84vw;
  background: #26262e; border: 1px solid #3a2c2c; color: #ffd7d7;
  border-radius: 12px; padding: 10px 16px; font-size: 14px;
  box-shadow: 0 8px 24px #0008;
}
#toast[hidden] { display: none; }
</style>
</head>
<body>
<header><nav id="tabs">
  <button data-tab="search" class="active">Search</button>
  <button data-tab="liked">Liked</button>
  <button data-tab="queue">Queue</button>
</nav></header>
<main>
  <section id="view-search">
    <form class="bar" id="search-form">
      <input id="search-input" type="search" placeholder="Search YouTube Music" autocomplete="off" enterkeyhint="search">
      <button type="submit">Go</button>
    </form>
    <div id="search-results" class="list"></div>
  </section>
  <section id="view-liked" hidden>
    <div class="toolbar">
      <button id="liked-play-all">Play all</button>
      <span class="count" id="liked-count"></span>
    </div>
    <div id="liked-list" class="list"></div>
  </section>
  <section id="view-queue" hidden>
    <div id="queue-list" class="list"></div>
  </section>
</main>
<footer id="player" hidden>
  <img class="bg" id="bg" alt="" aria-hidden="true">
  <div class="bg-blur" aria-hidden="true"></div>
  <div class="inner">
    <div class="line1">
      <span class="ptitle" id="player-title"></span>
    </div>
    <div class="line2">
      <span id="time-current">0:00</span>
      <div class="artist">
        <div class="spin" id="buffering" hidden></div>
        <span class="sub" id="player-sub"></span>
      </div>
      <span id="time-total">0:00</span>
    </div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <div class="controls">
      <button id="shuffle" aria-label="Shuffle" aria-pressed="false"></button>
      <div class="transport">
        <button id="prev" aria-label="Previous"></button>
        <button id="play" aria-label="Play or pause"></button>
        <button id="next" aria-label="Next"></button>
      </div>
      <div class="right">
        <button id="repeat" aria-label="Repeat"></button>
        <div class="extras">
          <button id="mute" aria-label="Mute"></button>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
          <button id="fullscreen" aria-label="Fullscreen"></button>
        </div>
      </div>
    </div>
  </div>
</footer>
<div id="overlay" hidden>
  <div class="card">
    <h2>Sign in</h2>
    <p>This resolver wants its token. On the server it is in
    <code>~/.config/ytui/resolver.token</code>.</p>
    <form id="login-form">
      <input id="token-input" type="password" placeholder="token" autocomplete="off">
      <button type="submit">Go</button>
    </form>
  </div>
</div>
<div id="toast" hidden></div>
<audio id="audio" preload="none"></audio>
<script>
"use strict";
// iOS Safari only paints :active on buttons once a touch listener exists.
document.addEventListener("touchstart", () => {}, { passive: true });
const $ = (id) => document.getElementById(id);
const audio = $("audio");

// ---------- state ----------
let queue = [];
try { queue = JSON.parse(localStorage.getItem("ytui-web-queue") || "[]"); } catch {}
// Volume is remembered across visits; it means nothing on iOS, where only the
// hardware buttons can change it, but setting it is harmless there.
let volume = 1;
try {
  const saved = parseFloat(localStorage.getItem("ytui-web-volume"));
  if (isFinite(saved)) volume = Math.min(1, Math.max(0, saved / 100));
} catch {}
let lastVolume = volume || 1; // what unmuting goes back to
let shuffle = false;  // pick the next track at random
let repeat = 0;       // 0 off, 1 repeat the queue, 2 repeat one track
let index = -1;       // position in the queue that is loaded
let liked = [];       // liked-music rows, fetched once per visit
let dead = 0;         // consecutive streams that failed outright
let loading = false;  // a track is being fetched and cannot play yet
// The duration the current tab reports. Safari gets fragmented HE-AAC wrong:
// it can report twice the real length while currentTime still advances in real
// seconds. The listing is authoritative, and the bar is mapped by how fast
// media time actually moves, so a doubled timeline is still handled.
let listDuration = 0;
let mediaScale = 1;   // media seconds per real second reported by the browser
let rateMedia = 0;    // media and wall clocks at the last rate sample
let rateWall = 0;
let ended = false;    // this track was already finished by the page
function saveQueue() { localStorage.setItem("ytui-web-queue", JSON.stringify(queue)); }
function current() { return queue[index] || null; }
function resetRate() {
  rateMedia = audio.currentTime;
  rateWall = performance.now();
}
function sampleRate() {
  const wall = performance.now();
  const dt = (wall - rateWall) / 1000;
  const media = audio.currentTime - rateMedia;
  if (dt < 3) {
    if (media < 0) resetRate(); // a seek moved the clock backwards
    return;
  }
  const ratio = media / dt;
  // Buffering only slows media time, so anything near 2x is a doubled clock.
  if (ratio > 1.5) mediaScale = 2;
  else if (ratio > 0.5) mediaScale = 1;
  resetRate();
}
function realDuration() {
  if (listDuration > 0) return listDuration;
  const media = isFinite(audio.duration) ? audio.duration : 0;
  return media > 0 ? media / mediaScale : 0;
}
function realTime() { return audio.currentTime / mediaScale; }

// ---------- icons ----------
const ICONS = {
  play: "M8 5v14l11-7z",
  pause: "M6 5h4v14H6zm8 0h4v14h-4z",
  next: "M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z",
  prev: "M18 6l-8.5 6L18 18V6zM8 6v12H6V6h2z",
  shuffle: "M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z",
  repeat: "M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z",
  repeat_one: "M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z",
  fullscreen: "M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z",
  fullscreen_exit: "M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z",
  add: "M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z",
  check: "M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z",
  close: "M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z",
  volume: "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z",
  muted: "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z",
};
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name]);
  path.setAttribute("fill", "currentColor");
  svg.appendChild(path);
  return svg;
}
function setIcon(btn, name) {
  btn.innerHTML = "";
  btn.appendChild(icon(name));
}

// ---------- volume ----------
function setVolume(v, save) {
  volume = Math.min(1, Math.max(0, v));
  audio.volume = volume;
  $("volume").value = Math.round(volume * 100);
  $("volume").style.setProperty("--fill", (volume * 100) + "%");
  setIcon($("mute"), volume ? "volume" : "muted");
  $("mute").setAttribute("aria-label", volume ? "Mute" : "Unmute");
  if (save) localStorage.setItem("ytui-web-volume", String(Math.round(volume * 100)));
}
$("volume").addEventListener("input", () => {
  const v = $("volume").value / 100;
  if (v > 0) lastVolume = v;
  setVolume(v, true);
});
$("mute").addEventListener("click", () => {
  if (volume > 0) {
    lastVolume = volume;
    setVolume(0, true);
  } else {
    setVolume(lastVolume, true);
  }
});
setVolume(volume, false);

// ---------- shuffle, repeat, fullscreen ----------
function renderModes() {
  $("shuffle").classList.toggle("on", shuffle);
  $("shuffle").setAttribute("aria-pressed", shuffle);
  $("repeat").classList.toggle("on", repeat > 0);
  $("repeat").setAttribute("aria-label",
    repeat === 2 ? "Repeat one" : repeat === 1 ? "Repeat all" : "Repeat");
  setIcon($("repeat"), repeat === 2 ? "repeat_one" : "repeat");
}
$("shuffle").addEventListener("click", () => { shuffle = !shuffle; renderModes(); });
$("repeat").addEventListener("click", () => { repeat = (repeat + 1) % 3; renderModes(); });
setIcon($("shuffle"), "shuffle");
$("fullscreen").addEventListener("click", () => {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) {
    (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    return;
  }
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!request) { toast("fullscreen is not available here"); return; }
  const answer = request.call(el);
  if (answer && answer.catch) answer.catch(() => toast("fullscreen was refused"));
});
function renderFullscreen() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  setIcon($("fullscreen"), on ? "fullscreen_exit" : "fullscreen");
  $("fullscreen").setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
}
document.addEventListener("fullscreenchange", renderFullscreen);
document.addEventListener("webkitfullscreenchange", renderFullscreen);
setIcon($("fullscreen"), "fullscreen");
renderModes();

// ---------- helpers ----------
function fmt(s) {
  if (!s) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + ":" + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0")
           : m + ":" + String(s % 60).padStart(2, "0");
}
async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (resp.status === 401) { $("overlay").hidden = false; throw new Error("unauthorized"); }
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || ("http " + resp.status));
  return body;
}
let toastTimer = 0;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 4000);
}
function skeleton(box, n) {
  box.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const div = document.createElement("div");
    div.className = "skel";
    div.innerHTML = '<div class="circle"></div><div class="bars"><div class="b1"></div><div class="b2"></div></div>';
    box.appendChild(div);
  }
}
function empty(box, text, spinning) {
  box.innerHTML = "";
  const div = document.createElement("div");
  div.className = "empty";
  if (spinning) {
    const sp = document.createElement("div");
    sp.className = "spin";
    div.appendChild(sp);
  }
  const p = document.createElement("div");
  p.textContent = text;
  div.appendChild(p);
  box.appendChild(div);
}

// ---------- login ----------
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = $("token-input").value.trim();
  if (!token) return;
  try {
    await api("/v1/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    $("overlay").hidden = true;
    checkSession();
  } catch (err) { toast("login failed: " + err.message); }
});
async function checkSession() {
  try {
    const s = await api("/v1/session");
    if (!s.cookies && tab === "liked") toast("the server has no cookies: Liked Music is empty");
  } catch { /* the login overlay is up */ }
}

// ---------- tabs ----------
let tab = "search";
$("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  tab = btn.dataset.tab;
  for (const b of $("tabs").children) b.classList.toggle("active", b === btn);
  $("view-search").hidden = tab !== "search";
  $("view-liked").hidden = tab !== "liked";
  $("view-queue").hidden = tab !== "queue";
  if (tab === "liked") loadLiked();
  if (tab === "queue") renderQueue();
});

// ---------- rows ----------
function row(item, onPlay, onAdd) {
  const div = document.createElement("div");
  div.className = "row";
  div.dataset.id = item.id;
  const meta = document.createElement("div");
  meta.className = "meta";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = item.title;
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = item.channel + (item.duration ? " · " + fmt(item.duration) : "");
  meta.append(title, sub);
  const add = document.createElement("button");
  add.className = "addbtn";
  add.setAttribute("aria-label", "Add to queue");
  setIcon(add, "add");
  let addTimer = 0;
  add.addEventListener("click", () => {
    onAdd();
    // Flip to a tick for a moment: the queue tab may not be open, so the tap
    // needs a result of its own.
    setIcon(add, "check");
    add.classList.add("done");
    clearTimeout(addTimer);
    addTimer = setTimeout(() => {
      setIcon(add, "add");
      add.classList.remove("done");
    }, 900);
  });
  const play = document.createElement("button");
  play.className = "pbtn";
  play.setAttribute("aria-label", "Play or pause");
  setIcon(play, "play");
  play.addEventListener("click", () => {
    const cur = current();
    if (cur && cur.id === item.id) {
      if (audio.paused) audio.play(); else audio.pause();
    } else {
      onPlay();
    }
  });
  div.append(meta, add, play);
  // A double-click anywhere on the row (but not on its buttons) plays it, the
  // way a desktop music player does; the play button still works on its own.
  div.addEventListener("dblclick", (e) => {
    if (e.target.closest("button")) return;
    onPlay();
  });
  return div;
}
function markPlaying() {
  const cur = current();
  for (const box of [$("search-results"), $("liked-list"), $("queue-list")]) {
    for (const div of box.children) {
      const isCur = !!cur && div.dataset.id === cur.id;
      div.classList.toggle("playing", isCur);
      const btn = div.querySelector(".pbtn");
      if (!btn) continue;
      const busy = isCur && loading;
      btn.classList.toggle("busy", busy);
      if (!busy) setIcon(btn, isCur && !audio.paused ? "pause" : "play");
    }
  }
  $("play").classList.toggle("busy", loading);
}

// ---------- playback ----------
// Lock-screen artwork: iOS sometimes drops metadata that was set before the
// stream started, so this is applied again from the `playing` handler.
function setSessionMetadata(t) {
  if (!("mediaSession" in navigator)) return;
  const art = [
    ["mqdefault", "320x180"],
    ["hqdefault", "480x360"],
    ["sddefault", "640x480"],
  ];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title,
    artist: t.channel,
    album: "ytui",
    artwork: art.map(([name, sizes]) => ({
      src: "https://i.ytimg.com/vi/" + t.id + "/" + name + ".jpg",
      sizes: sizes,
      type: "image/jpeg",
    })),
  });
}
// The lock screen takes its scrubber length from setPositionState; without it
// iOS uses the element's doubled duration and draws a bar twice too long.
let positionAt = 0;
function updatePositionState(force) {
  const ms = navigator.mediaSession;
  if (!ms || !ms.setPositionState) return;
  const now = performance.now();
  if (!force && now - positionAt < 1000) return;
  const duration = realDuration();
  if (!duration) return;
  const position = Math.min(Math.max(realTime(), 0), duration);
  positionAt = now;
  try {
    ms.setPositionState({ duration: duration, playbackRate: 1, position: position });
  } catch {}
}
function playIndex(i) {
  if (i < 0 || i >= queue.length) return;
  index = i;
  const t = queue[i];
  listDuration = t.duration || 0;
  mediaScale = 1;
  ended = false;
  loading = true;
  audio.src = "/audio/" + t.id;
  audio.play().catch((e) => { loading = false; markPlaying(); toast("playback failed: " + e.message); });
  resetRate();
  $("player").hidden = false;
  $("player-title").textContent = t.title;
  $("player-sub").textContent = t.channel;
  $("bg").src = "https://i.ytimg.com/vi/" + t.id + "/mqdefault.jpg";
  setSessionMetadata(t);
  updatePositionState(true);
  markPlaying();
}
// The open tab is the queue: playing a row from Liked or Search turns that
// list into the queue, so playback continues down what you are looking at.
function playFrom(items, i) {
  queue = items.slice();
  saveQueue();
  playIndex(i);
  if (tab === "queue") renderQueue();
}
function addToQueue(item, play) {
  queue.push(item);
  saveQueue();
  if (play || index < 0) playIndex(queue.length - 1);
  if (tab === "queue") renderQueue();
}
function stopPlayback() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  index = -1;
  loading = false;
  $("player").hidden = true;
  markPlaying();
}
$("play").addEventListener("click", () => (audio.paused ? audio.play() : audio.pause()));
// Shuffle picks any track but the current one; with repeat on, next wraps to
// the top of the queue instead of stopping at the end.
function nextIndex() {
  if (!queue.length) return -1;
  if (shuffle && queue.length > 1) {
    let n = index;
    while (n === index) n = Math.floor(Math.random() * queue.length);
    return n;
  }
  if (index + 1 >= queue.length && repeat === 1) return 0;
  return index + 1;
}
// Keep the visible list in step with the transport: after next the new track
// is the first row, after previous it is the second, so the one just played
// stays in view above it.
function revealCurrent(leading) {
  const t = current();
  if (!t) return;
  const box = $(tab === "search" ? "search-results"
            : tab === "liked" ? "liked-list" : "queue-list");
  const rows = [...box.children].filter((d) => d.dataset.id);
  const i = rows.findIndex((d) => d.dataset.id === t.id);
  if (i < 0) return;
  const target = leading ? rows[i] : rows[Math.max(0, i - 1)];
  target.scrollIntoView({ block: "start" });
}
$("next").addEventListener("click", () => {
  const n = nextIndex();
  if (n < 0 || n >= queue.length) return;
  playIndex(n);
  revealCurrent(true);
});
$("prev").addEventListener("click", () => {
  if (index <= 0) return;
  playIndex(index - 1);
  revealCurrent(false);
});
setIcon($("prev"), "prev");
setIcon($("play"), "play");
setIcon($("next"), "next");
audio.addEventListener("play", () => {
  if (ended) { // play after the queue ran out starts the track again
    audio.currentTime = 0;
    ended = false;
  }
  setIcon($("play"), "pause");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  updatePositionState(true);
  markPlaying();
});
audio.addEventListener("playing", () => {
  dead = 0;
  loading = false;
  $("buffering").hidden = true;
  resetRate();
  const t = current();
  if (t) setSessionMetadata(t); // iOS can drop artwork set before playback
  updatePositionState(true);
  markPlaying();
  prefetchNext();
});

// Warm the server's resolve cache for the next queue track while this one
// plays; the handover then costs the proxy's range request only.
const prefetched = new Set();
function prefetchNext() {
  if (shuffle || !queue[index]) return; // a random pick cannot be warmed ahead
  const n = index + 1 < queue.length ? index + 1
          : (repeat === 1 ? 0 : -1);
  const next = n >= 0 ? queue[n] : null;
  if (!next || next.id === queue[index].id || prefetched.has(next.id)) return;
  prefetched.add(next.id);
  fetch("/v1/resolve?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + next.id))
    .catch(() => {});
}
audio.addEventListener("waiting", () => { $("buffering").hidden = false; resetRate(); });
audio.addEventListener("pause", () => {
  setIcon($("play"), "play");
  $("buffering").hidden = true;
  loading = false;
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  updatePositionState(true);
  markPlaying();
});
// Safari can keep "playing" silence past the real length when it reports a
// doubled duration, so the page decides when a track is over instead of
// waiting for `ended`. Both paths share this guard.
function endTrack() {
  if (ended) return;
  ended = true;
  if (repeat === 2) { // repeat one: play the same stream again, no refetch
    audio.currentTime = 0;
    audio.play().catch(() => {});
    ended = false;
    updatePositionState(true);
    return;
  }
  const n = nextIndex();
  if (n >= 0 && n < queue.length) {
    playIndex(n);
  } else {
    audio.pause(); // stop the browser's silent tail
    markPlaying();
  }
}
// The browser's own end is only trusted while it still describes the loaded
// stream; an ended event queued for a stream we already left is ignored.
audio.addEventListener("ended", () => { if (audio.ended) endTrack(); });
audio.addEventListener("error", () => {
  $("buffering").hidden = true;
  loading = false;
  // Same rule as the terminal player: give up after five dead in a row.
  if (++dead >= 5) { dead = 0; toast("giving up: too many dead tracks in a row"); return; }
  playIndex(index + 1);
});
let seeking = false;
$("seek").addEventListener("input", () => {
  seeking = true;
  $("seek").style.setProperty("--fill", ($("seek").value / 10) + "%");
});
$("seek").addEventListener("change", () => {
  const total = realDuration();
  if (total) audio.currentTime = ($("seek").value / 1000) * total * mediaScale;
  seeking = false;
  ended = false; // seeking back into a finished track plays it again
  resetRate();
  updatePositionState(true);
});
audio.addEventListener("timeupdate", () => {
  const total = realDuration();
  let pos = realTime();
  if (!audio.paused && !seeking) sampleRate();
  if (total && pos >= total - 0.25) {
    pos = total;
    if (!audio.paused) endTrack();
  }
  if (!seeking) {
    $("seek").value = total ? Math.round((pos / total) * 1000) : 0;
    $("seek").style.setProperty("--fill", ($("seek").value / 10) + "%");
  }
  $("time-current").textContent = fmt(pos);
  $("time-total").textContent = fmt(total);
  updatePositionState(false);
});
// A new stream starts at 1x; the rate sample below proves otherwise.
audio.addEventListener("loadedmetadata", () => { mediaScale = 1; resetRate(); });
audio.addEventListener("durationchange", resetRate);
audio.addEventListener("seeked", () => { resetRate(); updatePositionState(true); });
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  try {
    ms.setActionHandler("play", () => audio.play());
    ms.setActionHandler("pause", () => audio.pause());
    ms.setActionHandler("previoustrack", () => {
      if (index <= 0) return;
      playIndex(index - 1);
      revealCurrent(false);
    });
    ms.setActionHandler("nexttrack", () => {
      const n = nextIndex();
      if (n < 0 || n >= queue.length) return;
      playIndex(n);
      revealCurrent(true);
    });
    ms.setActionHandler("seekto", (d) => {
      if (d.seekTime != null) {
        // the lock screen works in the timeline we advertise (real seconds)
        audio.currentTime = d.seekTime * mediaScale;
        updatePositionState(true);
      }
    });
  } catch {}
}

// ---------- search ----------
$("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("search-input").value.trim();
  if (!q) return;
  $("search-input").blur();
  const box = $("search-results");
  skeleton(box, 6);
  try {
    const out = await api("/v1/search?q=" + encodeURIComponent(q));
    box.innerHTML = "";
    if (!out.items.length) { empty(box, "nothing found"); return; }
    out.items.forEach((item, i) => {
      box.appendChild(row(item,
        () => playFrom(out.items, i),
        () => addToQueue(item, false)));
    });
    markPlaying();
  } catch (err) {
    box.innerHTML = "";
    toast(err.message);
  }
});

// ---------- liked ----------
function renderLiked() {
  const box = $("liked-list");
  box.innerHTML = "";
  $("liked-count").textContent = liked.length ? liked.length + " tracks" : "";
  if (!liked.length) {
    empty(box, "no liked music (the server needs --cookies)");
    return;
  }
  liked.forEach((item, i) => {
    box.appendChild(row(item,
      () => playFrom(liked, i),
      () => addToQueue(item, false)));
  });
  markPlaying();
}
async function loadLiked(refresh) {
  if (liked.length && !refresh) { renderLiked(); return; }
  const box = $("liked-list");
  skeleton(box, 8);
  try {
    const out = await api("/v1/liked");
    liked = out.items;
    renderLiked();
  } catch (err) {
    box.innerHTML = "";
    $("liked-count").textContent = "";
    toast(err.message);
  }
}
$("liked-play-all").addEventListener("click", () => {
  if (!liked.length) { toast("liked music is empty"); return; }
  queue = liked.slice();
  saveQueue();
  playIndex(0);
});

// ---------- queue ----------
function renderQueue() {
  const box = $("queue-list");
  box.innerHTML = "";
  if (!queue.length) {
    empty(box, "the queue is empty: search for something");
    return;
  }
  queue.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "row";
    div.dataset.id = item.id;
    const meta = document.createElement("div");
    meta.className = "meta";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = (i + 1) + ". " + item.title;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = item.channel + (item.duration ? " · " + fmt(item.duration) : "");
    meta.append(title, sub);
    meta.addEventListener("click", () => {
      // The same row twice (a double-click) must not reload the stream.
      if (i === index) { if (audio.paused) audio.play(); }
      else playIndex(i);
    });
    const rm = document.createElement("button");
    rm.setAttribute("aria-label", "Remove from queue");
    setIcon(rm, "close");
    rm.addEventListener("click", () => {
      const wasCurrent = i === index;
      const wasPlaying = wasCurrent && !audio.paused;
      queue.splice(i, 1);
      if (i < index) index--;
      if (wasCurrent) {
        if (!queue.length) {
          stopPlayback();
        } else if (wasPlaying) {
          // Removing what is playing continues with the next one; if the
          // last row was playing, the previous one takes over.
          playIndex(Math.min(i, queue.length - 1));
        } else {
          stopPlayback();
        }
      }
      saveQueue();
      renderQueue();
    });
    div.append(meta, rm);
    box.appendChild(div);
  });
  markPlaying();
}

checkSession();
renderQueue();
</script>
</body>
</html>
