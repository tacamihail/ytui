[package]
name = "ytui"
version = "0.4.1"
edition = "2021"
rust-version = "1.83"
description = "A YouTube Music player for the terminal"
license = "MIT"

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decoding: AAC in MP4/M4A is the only thing YouTube serves that we can use.
# Keeping the feature list minimal keeps the binary and the codec tables small.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
] }
cpal = "0.15"
ureq = "2"
# Only for mallopt(M_ARENA_MAX), so glibc does not reserve a 64 MB heap arena
# per thread and make the virtual size look huge.
libc = "0.2"
# Same crate and version ratatui uses, so our padding and its cell layout agree
# when a title contains wide characters.
unicode-width = "0.2"
# yt-dlp invocation and AAC candidate ranking, shared with the resolver server.
ytui-resolve = { path = "crates/resolve" }
# Local interface enumeration for the help-menu resolver scan.
if-addrs = "0.15"

# Standalone crate. Without this, cargo walks up the directory tree looking for
# a workspace root and trips over any Cargo.toml in a parent directory (for
# example an unrelated or half-finished one in ~/Downloads).
#
# The shared resolve crate is used by both the TUI and the optional resolver
# server. `default-members` keeps `cargo build --release` (and therefore
# install.sh and `ytui update`) building only the client.
[workspace]
members = ["crates/resolve", "crates/resolver"]
default-members = ["."]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
